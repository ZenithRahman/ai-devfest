    <meta name="description" content="Tender Document Package Builder - Client-side verification, duplicate detection, and PDF package generator." />
    <title>Tender Document Package Builder</title>
    <script>
      try {
        var t = localStorage.getItem('tender_builder_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.classList.toggle('dark', t === 'dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
